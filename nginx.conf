# Configuración mínima de nginx para servir la app estática sin que el
# navegador cachee agresivamente ningún archivo durante el desarrollo
# (evita el clásico "hice un cambio pero no se refleja"). Al principio esto
# solo cubría .js/.css; index.html quedaba fuera y el navegador seguía
# mostrando textos viejos de la interfaz aunque el servidor ya tuviera la
# versión nueva.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
}
